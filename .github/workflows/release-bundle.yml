name: Release Node Bundle

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    if: startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            aws_arch: x86_64
          - runner: ubuntu-24.04-arm
            aws_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB }}
    defaults:
      run:
        working-directory: CoCreate-server
    steps:
      - name: Checkout released server source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          path: CoCreate-server
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GITHUB }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install server build tools
        run: yarn install --ignore-scripts --non-interactive

      - name: Build and package release
        run: |
          yarn build
          if [[ "${{ matrix.aws_arch }}" == "arm64" ]]; then
            npm pack @github/copilot-linux-arm64@1.0.105 --pack-destination "$RUNNER_TEMP"
            mkdir -p "$RUNNER_TEMP/copilot-cli"
            tar -xzf "$RUNNER_TEMP/github-copilot-linux-arm64-1.0.105.tgz" -C "$RUNNER_TEMP/copilot-cli" package/copilot
            install -m 755 "$RUNNER_TEMP/copilot-cli/package/copilot" dist/node/plugins/ai/copilot-linux-arm64
          fi
          bash scripts/package-node-archive.sh
          version="$(node -p 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "${tag_version}" = "${version}"
          archive="cocreate-server-${version}-node-linux-${{ matrix.aws_arch }}.tar.gz"
          mkdir -p dist/releases
          cp "dist/cocreate-server-node-linux-${{ matrix.aws_arch }}.tar.gz" "dist/releases/${archive}"
          (cd dist/releases && sha256sum "${archive}" > "${archive}.sha256")

      - name: Attach bundle and checksum to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "dist/releases/cocreate-server-${GITHUB_REF_NAME#v}-node-linux-${{ matrix.aws_arch }}.tar.gz"
          "dist/releases/cocreate-server-${GITHUB_REF_NAME#v}-node-linux-${{ matrix.aws_arch }}.tar.gz.sha256"
          --repo "${GITHUB_REPOSITORY}" --clobber
