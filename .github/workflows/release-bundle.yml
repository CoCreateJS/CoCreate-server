name: Release Node Bundle

# Called only after semantic-release reports that npm publication succeeded.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      snapshot_artifact:
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  promote:
    uses: ./.github/workflows/promote-bundle.yml
    with:
      stage: main
      target_ref: ${{ inputs.tag }}
      target_tag: ${{ inputs.tag }}
      snapshot_artifact: ${{ inputs.snapshot_artifact }}
    secrets: inherit
